<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","logs","backends","groups","keys","context","guard","schemas","pipeline","rules","scripts"],"default":"dashboard"},"$preview":{"width":240,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 42px; border-radius: 10px; text-decoration: none; font-weight: 600; ';
    const num = 'width: 20px; height: 20px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; ';
    const keys = ['dashboard', 'logs', 'backends', 'groups', 'keys', 'context', 'guard', 'schemas', 'pipeline', 'rules', 'scripts'];
    const s = {};
    const n = {};
    keys.forEach((k) => {
      const on = k === active;
      s[k] = base + (on ? 'background: #FFFFFF; color: #3A1FD1; box-shadow: 0 1px 3px rgba(20,21,26,.08)' : 'color: #2B2E38');
      n[k] = num + (on ? 'background: #3A1FD1; color: #FFFFFF' : 'background: #E6E8EE; color: #2B2E38');
    });
    return { s, n };
  }
}
</script>
